[workspace]
members = [
    "premonition-core",
    "premonition-wasm",
    "premonition-cli",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Your Name"]
license = "MIT"

[workspace.dependencies]
num-traits = "0.2"
num-complex = "0.4"
wasm-bindgen = "0.2"
js-sys = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
